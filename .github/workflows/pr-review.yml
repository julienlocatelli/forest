name: PR review

# Claude reviews a pull request into main with the code-review skill, on two axes:
# the repository's standards, and the Go Forest story found from the branch's TASK number.
# It posts inline comments on the diff lines, plus one summary comment updated on each review.
# It never blocks merging: it is not a required check.
on:
  pull_request:
    types: [opened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

# A new review waits for the running one instead of cancelling it, so a review is never cut off
# between deleting the previous inline comments and posting its own.
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Outside the checkout, so the review changes no file in the repository.
    env:
      SPEC_FILE: /tmp/pr-review/story-spec.md
      REVIEW_FILE: /tmp/pr-review/review.json
    steps:
      - uses: actions/checkout@v4
        with:
          # The review diffs the branch against origin/main.
          fetch-depth: 0
      - uses: jdx/mise-action@v2
        with:
          install_args: bun
      - name: Read the story from Notion
        # The branch goes through the environment, never into the shell command.
        env:
          BRANCH: ${{ github.head_ref }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          mkdir -p "$(dirname "$SPEC_FILE")"
          bun .github/scripts/story-spec.ts "$SPEC_FILE"
      - name: Review with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: >-
            --allowedTools "Skill,Read,Glob,Grep,Task,Write,Bash(git diff:*),Bash(git log:*),Bash(git rev-parse:*),Bash(git show:*)"
          prompt: |
            Review this pull request with the repository's `code-review` skill. Do not ask questions: decide alone.

            - Fixed point: `origin/main`.
            - Spec: the Go Forest story in `${{ env.SPEC_FILE }}`. It is the spec the skill would otherwise look for; ignore the skill's mention of `docs/agents/issue-tracker.md`.
            - If that file starts with `Spec unavailable:`, there is no story: skip the Spec sub-agent, still run the Standards review, and make the `## Spec` section say the spec axis was skipped, quoting the reason from the file.
            - Change no file in the repository.

            Then write the review to `${{ env.REVIEW_FILE }}` as JSON, and nothing else in that file:

            ```json
            {
              "summary": "Markdown: a `## Standards` section and a `## Spec` section with the findings that point at no changed line, then the skill's one-line summary",
              "inline": [
                { "path": "path/from/the/repository/root", "line": 42, "code": "the exact text of that line", "axis": "Standards", "body": "Markdown finding" }
              ]
            }
            ```

            - Put a finding in `inline` when it points at one line that the pull request adds or changes: `line` is that line's number in the new version of the file, `code` is that line's exact text copied from the file, `axis` is `Standards` or `Spec`. Do not repeat it in `summary`.
            - Every other finding goes in `summary`, under its axis.
      - name: Post the review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: bun .github/scripts/post-review.ts "$REVIEW_FILE"
