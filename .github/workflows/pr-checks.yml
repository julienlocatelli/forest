name: PR checks

# Runs the repository checks on every pull request into main.
# The `checks` job is a required status check on main: a failing or unfinished run blocks the merge.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

# A new push replaces the run still going on the same pull request.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    # No secret and no database: end-to-end scenarios stay local.
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: bun node
      # Install scripts only download the Playwright browsers (test-e2e's postinstall), which the checks don't need.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Generate the Prisma client
        run: bun run --cwd apps/api prisma:generate
      - name: API lint
        run: bun run --cwd apps/api lint
      - name: API unit tests
        run: bun run --cwd apps/api test
      - name: Front lint
        run: bun run --cwd apps/front lint
      - name: Front build
        run: bun run --cwd apps/front build
      - name: Design tokens tests
        run: bun run --cwd packages/design-tokens test
      - name: Web components tests
        run: bun run --cwd packages/ui test
      - name: Storybook build
        run: bun run --cwd packages/ui build-storybook
      - name: Unused code (knip)
        run: bun run knip
      - name: Gherkin lint
        run: bun run lint:gherkin
      - name: Script tests
        run: bun run test:scripts
