name: PR checks

# Runs the repository checks on every pull request into main.
# The `checks` job is a required status check on main: a failing or unfinished run blocks the merge.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

# A new push replaces the run still going on the same pull request.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    # No secret and no database: end-to-end scenarios stay local.
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: bun node
      # Install scripts only download the Playwright browsers (test-e2e's postinstall), which the checks don't need.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Generate the Prisma client
        run: bun run --cwd apps/api prisma:generate
      - name: API lint
        run: bun run --cwd apps/api lint
      - name: API unit tests
        run: bun run --cwd apps/api test
      - name: Front lint
        run: bun run --cwd apps/front lint
      - name: Front build
        run: bun run --cwd apps/front build
      - name: Design tokens lint
        run: bun run --cwd packages/design-tokens lint
      - name: Design tokens tests
        run: bun run --cwd packages/design-tokens test
      - name: Web components lint
        run: bun run --cwd packages/ui lint
      - name: Web components tests
        run: bun run --cwd packages/ui test
      - name: Storybook build
        run: bun run --cwd packages/ui build-storybook
      - name: Mobile components type-check
        run: bun run --cwd packages/ui-native typecheck
      - name: Mobile components lint
        run: bun run --cwd packages/ui-native lint
      - name: Mobile components tests
        run: bun run --cwd packages/ui-native test
      # The mobile app is type-checked, linted and unit-tested only: no native iOS or Android build.
      - name: Mobile app type-check
        run: bun run --cwd apps/mobile typecheck
      - name: Mobile app lint
        run: bun run --cwd apps/mobile lint
      - name: Mobile app tests
        run: bun run --cwd apps/mobile test
      - name: Unused code (knip)
        run: bun run knip
      - name: E2E tests lint
        run: bun run --cwd test-e2e lint
      - name: Gherkin lint
        run: bun run lint:gherkin
      - name: Script tests
        run: bun run test:scripts
